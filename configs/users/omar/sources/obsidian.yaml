# Your Obsidian vault(s). Patterns are fnmatch globs on vault-relative paths ('*' crosses folders).
# Topics come from note tags (topics.yaml obsidian_tags) plus these folder rules.

sources:
- type: obsidian
  vault_path: /home/omar/Desktop/workDiaries
  include:
  - '*.md'
  skip_hidden: true
  include_hidden:                           # hidden paths kept anyway
  - 'myLibrary/_Revision Decks/.src/*'      # your revision decks (the PDFs there are renders of these)
  exclude:
  - Templates/*
  - copilot/*
  - copilot-conversations/*
  - '*.excalidraw.md'
  - 'images/Vodafone*'                      # job-application test: keep out of the dataset
  min_chars: 40
  pdf_include:                              # third-party PDFs (slides, lecture notes) → origin external
  - 'images/*.pdf'
  pdf_origin: external
  pdf_max_mb: 100
  topic_rules:
  # ---- revision decks (no frontmatter tags; matched by deck name)
  - {glob: '*/.src/Agentic AI*', topic: ai-agents}
  - {glob: '*/.src/Build AI Agents*', topic: ai-agents}
  - {glob: '*/.src/LangChain*', topic: ai-agents}
  - {glob: '*/.src/Algorithms*', topic: algorithms}
  - {glob: '*/.src/Data Structures*', topic: algorithms}
  - {glob: '*/.src/LeetCode*', topic: algorithms}
  - {glob: '*/.src/*Linear Algebra*', topic: math}
  - {glob: '*/.src/Matrix Calculus*', topic: math}
  - {glob: '*/.src/Discrete Math*', topic: math}
  - {glob: '*/.src/Optimization*', topic: math}
  - {glob: '*/.src/*Statistic*', topic: statistics-probability}
  - {glob: '*/.src/Biostatistics*', topic: statistics-probability}
  - {glob: '*/.src/Probability*', topic: statistics-probability}
  - {glob: '*/.src/AWS*', topic: cloud-devops}
  - {glob: '*/.src/C++*', topic: cpp}
  - {glob: '*/.src/Deep Learning*', topic: deep-learning}
  - {glob: '*/.src/*Computer Vision*', topic: computer-vision}
  - {glob: '*/.src/*NLP*', topic: nlp}
  - {glob: '*/.src/Stanford CS224N*', topic: nlp}
  - {glob: '*/.src/Transformers*', topic: transformers}
  - {glob: '*/.src/Learn Hugging Face*', topic: transformers}
